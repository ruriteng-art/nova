<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nova OS</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06152f">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}

body{
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    background:
    radial-gradient(circle at 82% 0%,rgba(0,220,255,.38) 0%,transparent 32%),
    radial-gradient(circle at 10% 18%,rgba(160,90,255,.26) 0%,transparent 36%),
    linear-gradient(180deg,#071a38 0%,#020814 100%);
    animation:bgGlow 8s ease-in-out infinite alternate;
}

body.deep-night{
    background:
    radial-gradient(circle at 82% 0%,rgba(120,80,255,.34) 0%,transparent 34%),
    radial-gradient(circle at 10% 18%,rgba(0,220,255,.22) 0%,transparent 36%),
    linear-gradient(180deg,#08102c 0%,#02040d 100%);
}

body.morning{
    background:
    radial-gradient(circle at 82% 0%,rgba(0,240,255,.42) 0%,transparent 32%),
    radial-gradient(circle at 10% 18%,rgba(120,190,255,.24) 0%,transparent 36%),
    linear-gradient(180deg,#0a2448 0%,#020814 100%);
}

@keyframes bgGlow{
    from{filter:saturate(1) brightness(1);}
    to{filter:saturate(1.18) brightness(1.08);}
}

.boot-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle at center,rgba(0,220,255,.18) 0%,transparent 34%),
    radial-gradient(circle,#0b2b55 0%,#020814 100%);
    transition:opacity .9s ease;
}

.boot-screen.hide{opacity:0;pointer-events:none;}

.boot-logo,
.boot-dot-small,
.boot-dot-big{
    position:absolute;
    object-fit:contain;
    opacity:0;
    filter:drop-shadow(0 0 28px rgba(0,220,255,.55));
}

.boot-logo{width:200px;animation:logoPhase 1.35s ease forwards;}
.boot-dot-small{width:120px;animation:dotSmallPhase 1.15s ease forwards;animation-delay:1.25s;}
.boot-dot-big{width:230px;animation:dotBigPhase 1.25s ease forwards;animation-delay:2.25s;}

.boot-text{
    position:absolute;
    margin-top:260px;
    font-size:24px;
    font-weight:800;
    letter-spacing:6px;
    color:#7de7ff;
    text-shadow:0 0 12px rgba(0,220,255,.8);
    opacity:0;
    animation:bootTextPhase 3.6s ease forwards;
}

.boot-sub{
    position:absolute;
    margin-top:322px;
    font-size:12px;
    letter-spacing:3px;
    color:rgba(180,245,255,.85);
    opacity:0;
    animation:bootSubPhase 3.6s ease forwards;
}

@keyframes logoPhase{
    0%{opacity:0;transform:scale(.72) rotate(-6deg);}
    25%{opacity:1;transform:scale(1);}
    72%{opacity:1;transform:scale(1.04);}
    100%{opacity:0;transform:scale(.86);}
}

@keyframes dotSmallPhase{
    0%{opacity:0;transform:scale(.45) translateY(20px);}
    30%{opacity:1;transform:scale(1.05) translateY(0);}
    70%{opacity:1;transform:scale(1) translateY(-4px);}
    100%{opacity:0;transform:scale(1.35) translateY(-8px);}
}

@keyframes dotBigPhase{
    0%{opacity:0;transform:scale(.65) translateY(18px);}
    28%{opacity:1;transform:scale(1.04) translateY(0);}
    72%{opacity:1;transform:scale(1) translateY(-5px);}
    100%{opacity:0;transform:scale(1.18) translateY(-10px);}
}

@keyframes bootTextPhase{
    0%{opacity:0;transform:translateY(8px);}
    20%{opacity:1;transform:translateY(0);}
    78%{opacity:1;}
    100%{opacity:0;transform:translateY(-6px);}
}

@keyframes bootSubPhase{
    0%,18%{opacity:0;}
    34%{opacity:.9;}
    78%{opacity:.9;}
    100%{opacity:0;}
}

.notice{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    left:50%;
    transform:translate(-50%,-120%);
    z-index:8000;
    width:calc(100% - 28px);
    max-width:480px;
    padding:12px 16px;
    border-radius:22px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 14px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.18);
    display:flex;
    gap:10px;
    align-items:center;
    opacity:0;
    transition:.7s ease;
}

.notice.show{transform:translate(-50%,0);opacity:1;}
.notice-icon{font-size:24px;}
.notice-text{font-size:14px;font-weight:800;}

.home{
    min-height:100vh;
    padding:10px;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-bottom:112px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.panel{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    padding:14px;
    background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    border:1px solid rgba(160,235,255,.32);
    box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 28px rgba(255,255,255,.04);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.top-panel{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
}

.clock{
    font-size:52px;
    font-weight:900;
    line-height:.95;
    letter-spacing:-1px;
    text-shadow:0 0 16px rgba(126,231,255,.7),0 0 42px rgba(0,220,255,.38);
}

.date{
    margin-top:6px;
    color:#79d8ff;
    font-size:17px;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
}

.weather-mini{
    width:108px;
    min-height:88px;
    border-radius:22px;
    padding:10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.18);
}

.weather-title{font-size:12px;opacity:.82;}
.weather-temp{margin-top:2px;font-size:29px;font-weight:900;line-height:1;}
.weather-desc{
    margin-top:4px;
    max-width:88px;
    font-size:11px;
    opacity:.78;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.nova-panel{
    min-height:205px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:0;
}

.nova{
    width:100%;
    max-width:248px;
    margin-bottom:-42px;
    object-fit:contain;
    filter:drop-shadow(0 0 26px rgba(0,180,255,.36));
    animation:float 5s ease-in-out infinite,breath 4.2s ease-in-out infinite;
    transition:opacity .55s ease,transform .55s ease;
}

.nova.switching{
    opacity:.35;
    transform:translateY(8px) scale(.98);
}

@keyframes float{
    0%{translate:0 0;}
    50%{translate:0 -7px;}
    100%{translate:0 0;}
}

@keyframes breath{
    0%{scale:1;}
    50%{scale:1.018;}
    100%{scale:1;}
}

.bubble{
    position:absolute;
    left:12px;
    right:12px;
    bottom:8px;

    min-height:34px;
    padding:8px 14px;

    display:flex;
    align-items:center;

    border-radius:14px;

    background:
    linear-gradient(90deg,
    rgba(90,45,180,.42),
    rgba(45,120,220,.22));

    border:1px solid rgba(210,180,255,.42);

    box-shadow:
    0 0 18px rgba(155,95,255,.26),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 0 18px rgba(170,120,255,.10);

    color:#ffffff;

    font-family:"Courier New",monospace;
    font-size:13px;
    font-weight:900;
    letter-spacing:.04em;

    text-shadow:
    0 0 6px rgba(255,255,255,.85),
    0 0 14px rgba(120,230,255,.55);

    opacity:1;
    transition:opacity .8s ease, transform .8s ease;
}

.bubble::before{
    content:">";
    margin-right:8px;
    color:#8df6ff;
    text-shadow:0 0 10px rgba(0,240,255,.9);
}

.bubble::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:14px;
    pointer-events:none;
    background:
    repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.08) 0px,
    rgba(255,255,255,.08) 1px,
    transparent 1px,
    transparent 4px);
    opacity:.18;
}

.bubble.fade{
    opacity:.18;
    transform:translateY(5px);
}

.dock-wrap{
    position:fixed;
    left:10px;
    right:10px;
    bottom:calc(10px + env(safe-area-inset-bottom));
    z-index:5000;
    padding:8px;
    border-radius:26px;
    background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 40px rgba(0,0,0,.32);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
}

.dock-wrap::-webkit-scrollbar{display:none;}

.dock-grid{
    display:flex;
    gap:10px;
    width:max-content;
}

.app-icon{
    flex:0 0 auto;
    width:64px;
    height:64px;
    border-radius:21px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    text-decoration:none;
    color:white;
    background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.22);
    transition:.22s;
}

.app-icon:active{
    transform:scale(.94);
    box-shadow:0 0 22px rgba(0,220,255,.45);
}

.app-img{
    width:30px;
    height:30px;
    object-fit:contain;
    border-radius:9px;
}

.app-emoji{font-size:25px;line-height:1;}
.app-label{font-size:9px;font-weight:800;opacity:.92;}

.nova-app{
    background:linear-gradient(135deg,rgba(0,220,255,.42),rgba(160,90,255,.30));
    box-shadow:0 0 20px rgba(0,220,255,.40),0 0 48px rgba(0,220,255,.22),inset 0 1px 0 rgba(255,255,255,.16);
    animation:novaPulse 3s ease-in-out infinite;
}

@keyframes novaPulse{
    0%{box-shadow:0 0 18px rgba(0,220,255,.28),0 0 36px rgba(0,220,255,.14);}
    50%{box-shadow:0 0 30px rgba(0,220,255,.58),0 0 60px rgba(0,220,255,.30);}
    100%{box-shadow:0 0 18px rgba(0,220,255,.28),0 0 36px rgba(0,220,255,.14);}
}

@media (min-width:700px){
    .home{
        max-width:520px;
        margin:0 auto;
    }

    .dock-wrap{
        left:50%;
        right:auto;
        width:500px;
        transform:translateX(-50%);
    }
}

</style>
</head>

<body>

<div class="boot-screen" id="bootScreen">

<img src="icon.png" class="boot-logo" alt="Nova Logo">
<img src="nova_dot_small.png" class="boot-dot-small" alt="Nova Dot Small">
<img src="nova_dot_big.png" class="boot-dot-big" alt="Nova Dot Big">

<div class="boot-text">NOVA OS</div>
<div class="boot-sub">PERSONAL AI INTERFACE</div>

</div>

<div class="notice" id="notice">
<div class="notice-icon">🔔</div>
<div class="notice-text" id="noticeText">Nova OS 起動完了や🙄</div>
</div>

<main class="home">

<section class="panel top-panel" id="topPanel">

<div>
<div class="clock" id="clock">00:00</div>
<div class="date" id="date">2026/5/26（水）</div>
</div>

<div class="weather-mini">
<div class="weather-title">天気</div>
<div class="weather-temp" id="weatherTemp">--</div>
<div class="weather-desc" id="weatherDesc">取得中</div>
</div>

</section>

<section class="panel nova-panel" id="novaPanel">

<img class="nova" id="novaImage" src="./nova_normal.png" alt="Nova">

<div class="bubble" id="novaBubble">ワイはまだまだ元気や🙄</div>

</section>

</main>

<section class="dock-wrap">

<div class="dock-grid">

<a class="app-icon nova-app" href="https://chatgpt.com/" target="_blank">
<img class="app-img" src="icon.png" alt="Nova">
<div class="app-label">Nova</div>
</a>

<a class="app-icon" href="https://www.youtube.com/" target="_blank">
<div class="app-emoji">▶️</div>
<div class="app-label">YouTube</div>
</a>

<a class="app-icon" href="https://studio.youtube.com/" target="_blank">
<div class="app-emoji">🎬</div>
<div class="app-label">Studio</div>
</a>

<a class="app-icon" href="https://x.com/hoshiyaAYATO" target="_blank">
<div class="app-emoji">𝕏</div>
<div class="app-label">X</div>
</a>

<a class="app-icon" href="https://calendar.google.com/" target="_blank">
<div class="app-emoji">📅</div>
<div class="app-label">Calendar</div>
</a>

<a class="app-icon" href="https://keep.google.com/" target="_blank">
<div class="app-emoji">📝</div>
<div class="app-label">Memo</div>
</a>

<a class="app-icon" href="https://drive.google.com/" target="_blank">
<div class="app-emoji">📁</div>
<div class="app-label">Drive</div>
</a>

<a class="app-icon" href="https://mail.google.com/" target="_blank">
<div class="app-emoji">✉️</div>
<div class="app-label">Mail</div>
</a>

</div>

</section>

<script>

setTimeout(()=>{

    document
    .getElementById("bootScreen")
    .classList.add("hide");

    showNotice("Nova OS 起動完了や🙄");

},3900);

function showNotice(text){

    const notice=document.getElementById("notice");
    const noticeText=document.getElementById("noticeText");

    noticeText.textContent=text;
    notice.classList.add("show");

    setTimeout(()=>{
        notice.classList.remove("show");
    },3200);

}

function setTimeTheme(){

    const hour=new Date().getHours();

    document.body.classList.remove("deep-night","morning");

    if(hour>=0 && hour<5){
        document.body.classList.add("deep-night");
    }

    if(hour>=5 && hour<10){
        document.body.classList.add("morning");
    }

}

setTimeTheme();

function updateClock(){

    const now=new Date();

    const h=String(now.getHours()).padStart(2,"0");
    const m=String(now.getMinutes()).padStart(2,"0");

    document.getElementById("clock").textContent=`${h}:${m}`;

    const days=["日","月","火","水","木","金","土"];

    document.getElementById("date").textContent=
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;

    setTimeTheme();

}

updateClock();
setInterval(updateClock,1000);

const novaMessages = [

"おかえりや🙄",
"今日は何するんや？😼",
"動画編集、終わったんか？🙄",
"そのサムネ、伸びそうやな😎",
"配信前の作戦会議する？😌",
"今日はポケモンの日か？🙄",
"また変な企画考えてるやろ🙄",
"ワイは嫌いじゃないで😌",
"その改造、だいぶ狂っとる🙄",
"それ絶対ミキシング用やろ😼",
"また30MS増えてない？🙄",
"積み、見えてるで🙄",
"編集進捗どうや？😌",
"今日は早めに寝ろ😴",
"深夜テンション入っとるな🙄",
"そのタイトル、ちょっと強いな🙄",
"でもワイは好きやで😌",
"ショート一本作るか？😼",
"今日は図鑑動画の日や🙄",
"配信、行けそうか？😌",
"トレーナータワーから逃げるな😡",
"またラティアス増えてない？🙄",
"色違い、出る気せーへんな🙄",
"そろそろ来る気もする😌",
"ワイは信じとるで🙄",
"今日の作業BGMある？🎵",
"ちょっと休憩しよか🙄",
"コーヒー飲む？☕",
"集中モード入るか😌",
"そのアイデア、かなりアリや🙄",
"未来OS感出てきたな😎",
"通知きとるで🙄",
"コメント来てるかも😼",
"X確認する？🙄",
"YouTube Studio見るか😌",
"登録増えてるとええな🙄",
"今日のCTRどうや？😼",
"その動画、あと一押し感ある🙄",
"ワイは伸びると思う😌",
"サムネ、もうちょい光らせる？🙄",
"その構図かなり見やすい😎",
"今日は作業デーやな😌",
"朝やで🙄",
"昼やで🙄",
"夜更かししすぎや🙄",
"寝落ちする前に保存しろ😡",
"Nova OS 起動完了や🙄"

];

const novaImages=[
"./nova_normal.png",
"./nova_sleepy.png",
"./nova_smile.png",
"./nova_troubled.png",
"./nova_analysis.png"
];

function updateNova(){

    const bubble=document.getElementById("novaBubble");
    const image=document.getElementById("novaImage");

    bubble.classList.add("fade");
    image.classList.add("switching");

    setTimeout(()=>{

        image.src=novaImages[Math.floor(Math.random()*novaImages.length)];
        bubble.textContent=novaMessages[Math.floor(Math.random()*novaMessages.length)];

        bubble.classList.remove("fade");
        image.classList.remove("switching");

    },500);

}

setInterval(updateNova,15000);

function weatherIcon(desc){

    const text=desc.toLowerCase();

    if(text.includes("rain")) return "🌧️";
    if(text.includes("cloud")) return "☁️";
    if(text.includes("snow")) return "❄️";
    if(text.includes("clear") || text.includes("sun")) return "☀️";
    if(text.includes("mist") || text.includes("fog")) return "🌫️";

    return "🌤️";
}

async function loadWeather(){

    try{

        const res=await fetch("https://wttr.in/?format=j1");
        const data=await res.json();

        const temp=data.current_condition[0].temp_C;
        const desc=data.current_condition[0].weatherDesc[0].value;

        document.getElementById("weatherTemp").textContent=`${weatherIcon(desc)} ${temp}°`;
        document.getElementById("weatherDesc").textContent=desc;

    }catch(e){

        document.getElementById("weatherTemp").textContent="失敗";
        document.getElementById("weatherDesc").textContent="APIエラー";

    }

}

loadWeather();

window.addEventListener("deviceorientation",event=>{

    const x=Math.max(-12,Math.min(12,event.gamma || 0));
    const y=Math.max(-12,Math.min(12,event.beta || 0));

    document.getElementById("topPanel").style.transform=
    `translate(${x * .25}px,${y * .08}px)`;

    document.getElementById("novaPanel").style.transform=
    `translate(${x * .35}px,${y * .10}px)`;

});

</script>

</body>
</html>
