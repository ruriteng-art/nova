<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nova OS</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06152f">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
color:white;
min-height:100vh;
overflow-x:hidden;

background:
radial-gradient(circle at 82% 0%,rgba(0,220,255,.38) 0%,transparent 32%),
radial-gradient(circle at 10% 18%,rgba(160,90,255,.26) 0%,transparent 36%),
linear-gradient(180deg,#071a38 0%,#020814 100%);

animation:bgGlow 8s ease-in-out infinite alternate;
}

@keyframes bgGlow{

from{
filter:saturate(1) brightness(1);
}

to{
filter:saturate(1.18) brightness(1.08);
}

}

/* 起動 */

.boot-screen{

position:fixed;
inset:0;
z-index:9999;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at center,rgba(0,220,255,.18) 0%,transparent 34%),
radial-gradient(circle,#0b2b55 0%,#020814 100%);

transition:opacity .9s ease;

}

.boot-screen.hide{
opacity:0;
pointer-events:none;
}

.boot-logo,
.boot-dot-small,
.boot-dot-big{

position:absolute;
opacity:0;
object-fit:contain;

filter:
drop-shadow(0 0 28px rgba(0,220,255,.55));

}

.boot-logo{
width:200px;
animation:logoPhase 1.35s ease forwards;
}

.boot-dot-small{
width:120px;
animation:dotSmallPhase 1.15s ease forwards;
animation-delay:1.25s;
}

.boot-dot-big{
width:230px;
animation:dotBigPhase 1.25s ease forwards;
animation-delay:2.25s;
}

.boot-text{

position:absolute;
margin-top:260px;

font-size:24px;
font-weight:800;
letter-spacing:6px;

color:#7de7ff;

text-shadow:
0 0 12px rgba(0,220,255,.8);

opacity:0;

animation:bootTextPhase 3.6s ease forwards;

}

.boot-sub{

position:absolute;
margin-top:322px;

font-size:12px;
letter-spacing:3px;

color:rgba(180,245,255,.85);

opacity:0;

animation:bootSubPhase 3.6s ease forwards;

}

@keyframes logoPhase{

0%{
opacity:0;
transform:scale(.72) rotate(-6deg);
}

25%{
opacity:1;
transform:scale(1);
}

72%{
opacity:1;
transform:scale(1.04);
}

100%{
opacity:0;
transform:scale(.86);
}

}

@keyframes dotSmallPhase{

0%{
opacity:0;
transform:scale(.45) translateY(20px);
}

30%{
opacity:1;
transform:scale(1.05) translateY(0);
}

70%{
opacity:1;
transform:scale(1) translateY(-4px);
}

100%{
opacity:0;
transform:scale(1.35) translateY(-8px);
}

}

@keyframes dotBigPhase{

0%{
opacity:0;
transform:scale(.65) translateY(18px);
}

28%{
opacity:1;
transform:scale(1.04) translateY(0);
}

72%{
opacity:1;
transform:scale(1) translateY(-5px);
}

100%{
opacity:0;
transform:scale(1.18) translateY(-10px);
}

}

@keyframes bootTextPhase{

0%{
opacity:0;
transform:translateY(8px);
}

20%{
opacity:1;
transform:translateY(0);
}

78%{
opacity:1;
}

100%{
opacity:0;
transform:translateY(-6px);
}

}

@keyframes bootSubPhase{

0%,18%{
opacity:0;
}

34%{
opacity:.9;
}

78%{
opacity:.9;
}

100%{
opacity:0;
}

}

.home{

min-height:100vh;

padding:8px;
padding-top:calc(8px + env(safe-area-inset-top));
padding-bottom:108px;

display:flex;
flex-direction:column;

gap:6px;

}

.panel{

position:relative;
overflow:hidden;

border-radius:24px;

padding:11px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.16),
rgba(255,255,255,.05)
);

border:
1px solid rgba(160,235,255,.32);

box-shadow:
0 18px 40px rgba(0,0,0,.28),
inset 0 1px 0 rgba(255,255,255,.18),
inset 0 0 28px rgba(255,255,255,.04);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

}

/* 時計 */

.top-panel{

display:grid;
grid-template-columns:1fr auto;

gap:10px;
align-items:center;

min-height:86px;

}

.clock{

font-size:46px;
font-weight:900;

line-height:.9;
letter-spacing:-1px;

text-shadow:
0 0 16px rgba(126,231,255,.7),
0 0 42px rgba(0,220,255,.38);

}

.date{

margin-top:4px;

color:#79d8ff;

font-size:15px;
font-weight:800;

line-height:1;

white-space:nowrap;

}

/* 天気 */

.weather-mini{

width:100px;
min-height:74px;

border-radius:20px;

padding:8px;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,.18),
rgba(255,255,255,.06)
);

border:
1px solid rgba(255,255,255,.16);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.18),
0 8px 24px rgba(0,0,0,.18);

}

.weather-title{
font-size:11px;
opacity:.82;
}

.weather-temp{

margin-top:1px;

font-size:24px;
font-weight:900;

line-height:1;

}

.weather-desc{

margin-top:3px;

max-width:80px;

font-size:10px;

opacity:.78;

text-align:center;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

/* Search */

.search-panel{

padding:8px 10px;

}

.search-box{

position:relative;

display:flex;
align-items:center;

gap:8px;

overflow:hidden;

}

.search-box::before{

content:"";

position:absolute;
top:0;
bottom:0;
left:-120px;

width:120px;

background:
linear-gradient(
90deg,
transparent,
rgba(120,240,255,.18),
transparent
);

transform:skewX(-22deg);

animation:searchScan 4s linear infinite;

pointer-events:none;

}

@keyframes searchScan{

0%{
left:-120px;
}

100%{
left:120%;
}

}

.search-label{

flex:0 0 auto;

font-family:"Courier New",monospace;

font-size:11px;
font-weight:900;

letter-spacing:.12em;

color:#8df6ff;

text-shadow:
0 0 10px rgba(0,240,255,.8);

}

.search-input{

flex:1;
min-width:0;

border:none;
outline:none;

background:rgba(255,255,255,.08);

color:white;

padding:9px 10px;

border-radius:14px;

font-size:14px;
font-weight:700;

box-shadow:
inset 0 0 12px rgba(0,220,255,.12);

}

.search-input::placeholder{

color:rgba(255,255,255,.55);

}

.search-button{

flex:0 0 auto;

width:38px;
height:38px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
rgba(0,220,255,.34),
rgba(160,90,255,.24)
);

color:white;

font-size:17px;

box-shadow:
0 0 18px rgba(0,220,255,.22);

}

.nova-panel{

min-height:188px;

display:flex;
align-items:flex-end;
justify-content:center;

padding-bottom:0;

}

/* HUD */

.nova-panel::before{

content:"";

position:absolute;
inset:0;

pointer-events:none;

background:

radial-gradient(
circle at center,
rgba(0,220,255,.08) 0%,
transparent 58%
),

repeating-linear-gradient(
to bottom,
rgba(120,220,255,.045) 0px,
rgba(120,220,255,.045) 1px,
transparent 1px,
transparent 24px
);

opacity:.55;

animation:
hudFloat 8s ease-in-out infinite alternate;

}

.nova-panel::after{

content:"";

position:absolute;

width:240px;
height:240px;

left:50%;
top:50%;

transform:translate(-50%,-52%);

border-radius:50%;

border:
1px solid rgba(120,240,255,.12);

box-shadow:
0 0 24px rgba(0,220,255,.10),
inset 0 0 24px rgba(0,220,255,.05);

pointer-events:none;

animation:
hudRotate 28s linear infinite,
hudPulse 6s ease-in-out infinite;

}

.app-emoji{
font-size:25px;
line-height:1;
}@keyframes hudRotate{

from{
transform:translate(-50%,-52%) rotate(0deg);
}

to{
transform:translate(-50%,-52%) rotate(360deg);
}

}

@keyframes hudPulse{

0%{
opacity:.22;
}

50%{
opacity:.42;
}

100%{
opacity:.22;
}

}

@keyframes hudFloat{

from{
opacity:.35;
transform:translateY(0px);
}

to{
opacity:.62;
transform:translateY(-2px);
}

}

.nova{

position:relative;
z-index:2;

width:100%;
max-width:238px;

margin-bottom:-46px;

object-fit:contain;

filter:
drop-shadow(0 0 26px rgba(0,180,255,.36));

animation:
float 5s ease-in-out infinite,
breath 4.2s ease-in-out infinite;

transition:
opacity .55s ease,
transform .55s ease;

}

.nova.switching{
opacity:.35;
transform:translateY(8px) scale(.98);
}

@keyframes float{

0%{
translate:0 0;
}

50%{
translate:0 -7px;
}

100%{
translate:0 0;
}

}

@keyframes breath{

0%{
scale:1;
}

50%{
scale:1.018;
}

100%{
scale:1;
}

}

.bubble{

position:absolute;

left:12px;
right:12px;
bottom:8px;

z-index:3;

min-height:34px;

padding:8px 14px;

display:flex;
align-items:center;

border-radius:14px;

background:
linear-gradient(
90deg,
rgba(90,45,180,.58),
rgba(45,120,220,.34)
);

border:
1px solid rgba(210,180,255,.42);

box-shadow:
0 0 18px rgba(155,95,255,.26),
inset 0 1px 0 rgba(255,255,255,.16),
inset 0 0 18px rgba(170,120,255,.10);

color:#ffffff;

font-family:"Courier New",monospace;

font-size:13px;
font-weight:900;

letter-spacing:.04em;

text-shadow:
0 0 6px rgba(255,255,255,.85),
0 0 14px rgba(120,230,255,.55);

opacity:1;

transition:
opacity .8s ease,
transform .8s ease;

}

.bubble::before{

content:">";

margin-right:8px;

color:#8df6ff;

text-shadow:
0 0 10px rgba(0,240,255,.9);

}

.bubble.fade{

opacity:.18;

transform:translateY(5px);

}

.dock-wrap{

position:fixed;

left:10px;
right:10px;

bottom:calc(10px + env(safe-area-inset-bottom));

z-index:5000;

padding:8px;

border-radius:26px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.16),
rgba(255,255,255,.055)
);

border:
1px solid rgba(255,255,255,.16);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.18),
0 16px 40px rgba(0,0,0,.32);

backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);

overflow-x:auto;
overflow-y:hidden;

-webkit-overflow-scrolling:touch;

scroll-behavior:smooth;

scrollbar-width:none;

}

.dock-wrap::-webkit-scrollbar{
display:none;
}

.dock-grid{

display:flex;

gap:10px;

width:max-content;

}

.app-icon{

flex:0 0 auto;

width:64px;
height:64px;

border-radius:21px;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

gap:3px;

text-decoration:none;

color:white;

background:
linear-gradient(
145deg,
rgba(255,255,255,.16),
rgba(255,255,255,.055)
);

border:
1px solid rgba(255,255,255,.14);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.14),
0 8px 20px rgba(0,0,0,.22);

transition:.22s;

}

.app-icon:active{

transform:scale(.94);

box-shadow:
0 0 22px rgba(0,220,255,.45);

}

.app-img{

width:32px;
height:32px;

object-fit:contain;

border-radius:9px;

}

.app-label{

font-size:9px;
font-weight:800;

opacity:.92;

}

.nova-app{

background:
linear-gradient(
135deg,
rgba(0,220,255,.42),
rgba(160,90,255,.30)
);

box-shadow:
0 0 20px rgba(0,220,255,.40),
0 0 48px rgba(0,220,255,.22),
inset 0 1px 0 rgba(255,255,255,.16);

animation:novaPulse 3s ease-in-out infinite;

}

@keyframes novaPulse{

0%{
box-shadow:
0 0 18px rgba(0,220,255,.28),
0 0 36px rgba(0,220,255,.14);
}

50%{
box-shadow:
0 0 30px rgba(0,220,255,.58),
0 0 60px rgba(0,220,255,.30);
}

100%{
box-shadow:
0 0 18px rgba(0,220,255,.28),
0 0 36px rgba(0,220,255,.14);
}

}

</style>
</head>

<body>

<div class="boot-screen" id="bootScreen">

<img src="icon.png" class="boot-logo">
<img src="nova_dot_small.png" class="boot-dot-small">
<img src="nova_dot_big.png" class="boot-dot-big">

<div class="boot-text">NOVA OS</div>
<div class="boot-sub">PERSONAL AI INTERFACE</div>

</div>

<main class="home">

<section class="panel top-panel">

<div>
<div class="clock" id="clock">00:00</div>
<div class="date" id="date">2026/5/26（水）</div>
</div>

<div class="weather-mini">

<div class="weather-title">天気</div>

<div class="weather-temp" id="weatherTemp">
--
</div>

<div class="weather-desc" id="weatherDesc">
取得中
</div>

</div>

</section>

<section class="panel search-panel">

<form class="search-box" id="searchForm">

<div class="search-label">
NOVA SEARCH
</div>

<input
class="search-input"
id="searchInput"
type="text"
placeholder="NOVAに聞く..."
autocomplete="off">

<button class="search-button" type="submit">
🔍
</button>

</form>

</section>

<section class="panel nova-panel">

<img
class="nova"
id="novaImage"
src="./nova_normal.png">

<div class="bubble" id="novaBubble">
ワイはまだまだ元気や🙄
</div>

</section>

</main>

<section class="dock-wrap">

<div class="dock-grid">

<a class="app-icon nova-app" href="https://chatgpt.com/" target="_blank">
<img class="app-img" src="icon.png">
<div class="app-label">Nova</div>
</a>

<a class="app-icon" href="https://x.com/hoshiyaAYATO" target="_blank">
<img class="app-img" src="X.png">
<div class="app-label">X</div>
</a>

<a class="app-icon" href="https://www.youtube.com/" target="_blank">
<img class="app-img" src="Youtube.png">
<div class="app-label">YouTube</div>
</a>

<a class="app-icon" href="https://studio.youtube.com/" target="_blank">
<div class="app-emoji">🎬</div>
<div class="app-label">Studio</div>
</a>

<a class="app-icon" href="https://mail.google.com/" target="_blank">
<div class="app-emoji">✉️</div>
<div class="app-label">Mail</div>
</a>

<a class="app-icon" href="https://jp.mercari.com/" target="_blank">
<img class="app-img" src="merukari.png">
<div class="app-label">Mercari</div>
</a>

<a class="app-icon" href="https://www.amazon.co.jp/" target="_blank">
<div class="app-emoji">📦</div>
<div class="app-label">Amazon</div>
</a>

<a class="app-icon" href="https://www.dmm.com/" target="_blank">
<div class="app-emoji">🟣</div>
<div class="app-label">DMM</div>
</a>

<a class="app-icon" href="https://bandai-hobby.net/" target="_blank">
<div class="app-emoji">🤖</div>
<div class="app-label">Bandai</div>
</a>

</div>

</section>

<script>

const bootScreen = document.querySelector(".boot-screen");

setTimeout(() => {
bootScreen.classList.add("hide");
}, 3900);

function updateClock(){

const now = new Date();

const h = String(now.getHours()).padStart(2,"0");
const m = String(now.getMinutes()).padStart(2,"0");

const days = [
"日","月","火","水","木","金","土"
];

document.getElementById("clock").textContent =
`${h}:${m}`;

document.getElementById("date").textContent =
`${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;

}

updateClock();
setInterval(updateClock,1000);

const novaMessages = [

"おかえりや🙄",
"今日は何するんや？😼",
"動画編集、終わったんか？🙄",
"そのサムネ、伸びそうやな😎",
"配信前の作戦会議する？😌",
"今日はポケモンの日か？🙄",
"また変な企画考えてるやろ🙄",
"ワイは嫌いじゃないで😌",
"その改造、だいぶ狂っとる🙄",
"それ絶対ミキシング用やろ😼",
"また30MS増えてない？🙄",
"積み、見えてるで🙄",
"編集進捗どうや？😌",
"今日は早めに寝ろ😴",
"深夜テンション入っとるな🙄",
"そのタイトル、ちょっと強いな🙄",
"でもワイは好きやで😌",
"ショート一本作るか？😼",
"今日は図鑑動画の日や🙄",
"配信、行けそうか？😌",
"トレーナータワーから逃げるな😡",
"またラティアス増えてない？🙄",
"色違い、出る気せーへんな🙄",
"そろそろ来る気もする😌",
"ワイは信じとるで🙄",
"今日の作業BGMある？🎵",
"ちょっと休憩しよか🙄",
"コーヒー飲む？☕",
"集中モード入るか😌",
"そのアイデア、かなりアリや🙄",
"通知きとるで🙄",
"コメント来てるかも😼",
"X確認する？🙄",
"YouTube Studio見るか😌",
"登録増えてるとええな🙄",
"今日のCTRどうや？😼",
"その動画、あと一押し感ある🙄",
"ワイは伸びると思う😌",
"サムネ、もうちょい光らせる？🙄",
"その構図かなり見やすい😎",
"今日は作業デーやな😌",
"朝やで🙄",
"昼やで🙄",
"夜更かししすぎや🙄",
"寝落ちする前に保存しろ😡",
"Nova OS 起動完了や🙄"

];

const novaImages = [
"./nova_normal.png",
"./nova_sleepy.png",
"./nova_smile.png",
"./nova_troubled.png",
"./nova_analysis.png"
];

function updateNova(){

const bubble = document.getElementById("novaBubble");
const image = document.getElementById("novaImage");

bubble.classList.add("fade");
image.classList.add("switching");

setTimeout(() => {

image.src =
novaImages[Math.floor(Math.random()*novaImages.length)];

bubble.textContent =
novaMessages[Math.floor(Math.random()*novaMessages.length)];

bubble.classList.remove("fade");
image.classList.remove("switching");

},500);

}

setInterval(updateNova,15000);

function weatherIcon(desc){

const text = desc.toLowerCase();

if(text.includes("rain")) return "🌧️";
if(text.includes("cloud")) return "☁️";
if(text.includes("snow")) return "❄️";
if(text.includes("clear") || text.includes("sun")) return "☀️";
if(text.includes("mist") || text.includes("fog")) return "🌫️";

return "🌤️";
}

async function loadWeather(){

try{

const res =
await fetch("https://wttr.in/?format=j1");

const data =
await res.json();

const temp =
data.current_condition[0].temp_C;

const desc =
data.current_condition[0].weatherDesc[0].value;

document.getElementById("weatherTemp").textContent =
`${weatherIcon(desc)} ${temp}°`;

document.getElementById("weatherDesc").textContent =
desc;

}catch(e){

document.getElementById("weatherTemp").textContent =
"失敗";

document.getElementById("weatherDesc").textContent =
"APIエラー";

}

}

loadWeather();

const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");

searchForm.addEventListener("submit", async function(e){

e.preventDefault();

const query =
searchInput.value.trim();

if(!query){
searchInput.placeholder = "検索ワード入れてや🙄";
return;
}

const bubble =
document.getElementById("novaBubble");

bubble.textContent =
"PCへ送信中や…🙄";

try{

const res =
await fetch("http://192.168.0.117:3000/message",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:query
})

});

const data =
await res.json();

bubble.textContent =
data.reply || "PCに届いたで🙄";

searchInput.value = "";
searchInput.placeholder = "NOVAに聞く...";

}catch(err){

bubble.textContent =
"PCに接続できへんかった😢";

searchInput.placeholder =
"PCサーバー確認してや🙄";

}

});

</script>

</body>
</html>
