<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nova OS</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06152f">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
    background:
    radial-gradient(circle at 80% 0%,
    rgba(0,220,255,.32) 0%,
    transparent 32%),
    radial-gradient(circle at 15% 18%,
    rgba(150,80,255,.22) 0%,
    transparent 34%),
    linear-gradient(180deg,#071a38 0%,#020814 100%);

    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.boot-screen{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(circle,
    #0b2b55 0%,
    #020814 100%);

    transition:opacity .9s ease;
}

.boot-screen.hide{
    opacity:0;
    pointer-events:none;
}

.boot-logo{
    width:200px;
    animation:
    bootFloat 4s ease-in-out infinite,
    bootAppear 1.1s ease;
}

.boot-text{
    margin-top:16px;
    font-size:24px;
    font-weight:800;
    letter-spacing:6px;
    color:#7de7ff;
    text-shadow:0 0 12px rgba(0,220,255,.8);
}

@keyframes bootAppear{
    from{opacity:0;transform:scale(.72);}
    to{opacity:1;transform:scale(1);}
}

@keyframes bootFloat{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

.home{
    padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top));
    padding-bottom:calc(12px + env(safe-area-inset-bottom));

    display:flex;
    flex-direction:column;
    gap:10px;
}

.panel{
    position:relative;
    overflow:hidden;

    border-radius:24px;
    padding:16px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.16),
    rgba(255,255,255,.05));

    border:1px solid rgba(160,235,255,.32);

    box-shadow:
    0 18px 40px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 0 28px rgba(255,255,255,.04);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.top-panel{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
}

.clock{
    font-size:56px;
    font-weight:900;
    line-height:.95;
    letter-spacing:-1px;
}

.date{
    margin-top:7px;
    color:#79d8ff;
    font-size:18px;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
}

.weather-mini{
    width:118px;
    min-height:94px;

    border-radius:22px;
    padding:12px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.18),
    rgba(255,255,255,.06));

    border:1px solid rgba(255,255,255,.16);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 8px 24px rgba(0,0,0,.18);
}

.weather-title{
    font-size:13px;
    opacity:.82;
}

.weather-temp{
    margin-top:2px;
    font-size:32px;
    font-weight:900;
    line-height:1;
}

.weather-desc{
    margin-top:4px;
    max-width:96px;
    font-size:12px;
    opacity:.78;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.nova-panel{
    min-height:265px;

    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.nova{
    width:100%;
    max-width:225px;
    object-fit:contain;

    filter:
    drop-shadow(0 0 24px rgba(0,180,255,.32));

    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
    100%{transform:translateY(0);}
}

.bubble{
    position:absolute;
    bottom:10px;
    right:10px;

    max-width:76%;

    background:rgba(255,255,255,.94);
    color:#111;

    padding:8px 13px;
    border-radius:999px;

    font-size:14px;
    font-weight:800;

    box-shadow:
    0 8px 20px rgba(0,0,0,.28);
}

.launcher{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.app-button{
    min-height:58px;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:white;

    font-size:17px;
    font-weight:900;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.15),
    rgba(255,255,255,.045));

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    0 10px 26px rgba(0,0,0,.22);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    transition:.22s;
}

.app-button:active{
    transform:scale(.96);
    box-shadow:
    0 0 25px rgba(0,220,255,.45);
}

.nova-button{
    background:
    linear-gradient(
    135deg,
    rgba(0,220,255,.32),
    rgba(160,90,255,.24));
}

@media (min-width:700px){

    .home{
        max-width:520px;
        margin:0 auto;
    }

}

</style>
</head>

<body>

<div class="boot-screen" id="bootScreen">

<img
src="icon.png"
class="boot-logo"
alt="Nova Logo">

<div class="boot-text">
NOVA OS
</div>

</div>

<main class="home">

<section class="panel top-panel">

<div>
<div class="clock" id="clock">
00:00
</div>

<div class="date" id="date">
2026/5/26（火）
</div>
</div>

<div class="weather-mini">

<div class="weather-title">
天気
</div>

<div class="weather-temp" id="weatherTemp">
--
</div>

<div class="weather-desc" id="weatherDesc">
取得中
</div>

</div>

</section>

<section class="panel nova-panel">

<img
class="nova"
id="novaImage"
src="./nova_normal.png"
alt="Nova">

<div class="bubble" id="novaBubble">
ワイはまだまだ元気や🙄
</div>

</section>

<section class="launcher">

<a
class="app-button nova-button"
href="https://chatgpt.com/"
target="_blank">
✨ Nova
</a>

<a
class="app-button"
href="https://www.youtube.com/"
target="_blank">
▶️ YouTube
</a>

<a
class="app-button"
href="https://x.com/hoshiyaAYATO"
target="_blank">
𝕏
</a>

<a
class="app-button"
href="https://calendar.google.com/"
target="_blank">
📅 Calendar
</a>

</section>

</main>

<script>

setTimeout(()=>{

    document
    .getElementById("bootScreen")
    .classList.add("hide");

},1700);

function updateClock(){

    const now=new Date();

    const h=
    String(now.getHours()).padStart(2,"0");

    const m=
    String(now.getMinutes()).padStart(2,"0");

    document.getElementById("clock").textContent=
    `${h}:${m}`;

    const days=[
    "日","月","火","水","木","金","土"
    ];

    document.getElementById("date").textContent=
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;

}

updateClock();

setInterval(updateClock,1000);

const novaData=[

{
img:"./nova_normal.png",
msg:"今日は何するんや？😼"
},

{
img:"./nova_sleepy.png",
msg:"そろそろ寝るか…😴"
},

{
img:"./nova_smile.png",
msg:"そのサムネ、伸びるぞ😎"
},

{
img:"./nova_troubled.png",
msg:"編集終わる気せーへん🙄"
},

{
img:"./nova_analysis.png",
msg:"配信前の作戦会議するか？😌"
}

];

function updateNova(){

    const random=
    novaData[
    Math.floor(Math.random()*novaData.length)
    ];

    document.getElementById("novaImage").src=
    random.img;

    document.getElementById("novaBubble").textContent=
    random.msg;

}

setInterval(updateNova,15000);

async function loadWeather(){

    try{

        const res=
        await fetch(
        "https://wttr.in/?format=j1"
        );

        const data=
        await res.json();

        const temp=
        data.current_condition[0].temp_C;

        const desc=
        data.current_condition[0]
        .weatherDesc[0].value;

        document.getElementById("weatherTemp")
        .textContent=`${temp}°`;

        document.getElementById("weatherDesc")
        .textContent=desc;

    }catch(e){

        document.getElementById("weatherTemp")
        .textContent="失敗";

        document.getElementById("weatherDesc")
        .textContent="APIエラー";

    }

}

loadWeather();

</script>

</body>
</html>
