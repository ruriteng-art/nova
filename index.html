<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nova OS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
"Segoe UI",
sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{

background:
radial-gradient(circle at top,
#113355 0%,
#090b1a 60%,
#02040a 100%);

min-height:100vh;
overflow-x:hidden;
color:white;
padding:20px;
}

body::before{

content:"";
position:fixed;
inset:0;

background:
linear-gradient(
transparent 96%,
rgba(120,180,255,.05) 100%
);

background-size:100% 32px;

pointer-events:none;
opacity:.4;
}

.app{

max-width:760px;
margin:auto;
display:flex;
flex-direction:column;
gap:14px;
}

/* ===== ガラス ===== */

.glass{

background:
linear-gradient(
135deg,
rgba(255,255,255,.12),
rgba(255,255,255,.05)
);

border:
1px solid rgba(255,255,255,.15);

backdrop-filter:blur(18px);

box-shadow:
0 8px 32px rgba(0,0,0,.35),
inset 0 1px 1px rgba(255,255,255,.15);

border-radius:32px;
position:relative;
overflow:hidden;
}

/* ===== 上 ===== */

.top-wrap{

display:flex;
gap:14px;
}

.clock-box{

flex:1;
padding:22px;
min-height:140px;

background:
radial-gradient(
circle at top left,
rgba(0,255,255,.12),
transparent 40%
),
linear-gradient(
135deg,
rgba(80,120,255,.16),
rgba(255,255,255,.04)
);
}

.time{

font-size:82px;
font-weight:900;
line-height:1;
text-shadow:
0 0 22px rgba(255,255,255,.25);
}

.date{

margin-top:8px;
font-size:28px;
font-weight:700;
color:#7ee7ff;
}

.weather{

width:220px;
padding:18px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
rgba(180,120,255,.16),
rgba(255,255,255,.05)
);
}

.weather .temp{

font-size:72px;
font-weight:900;
}

/* ===== SEARCH ===== */

.search-panel{

height:92px;
padding:14px 18px;

display:flex;
align-items:center;
gap:16px;

position:relative;
overflow:hidden;
}

.search-panel::before{

content:"";
position:absolute;
inset:0;

background:
linear-gradient(
90deg,
transparent,
rgba(120,255,255,.06),
transparent
);

transform:translateX(-100%);
animation:scan 4s linear infinite;
}

@keyframes scan{

100%{
transform:translateX(100%);
}
}

.search-title{

font-size:18px;
font-weight:900;
letter-spacing:.2em;
color:#9ffcff;

text-shadow:
0 0 12px rgba(120,255,255,.7);
}

.search-box{

flex:1;
height:58px;
border-radius:22px;

background:
rgba(255,255,255,.08);

display:flex;
align-items:center;

padding:0 18px;
}

.search-box input{

width:100%;
background:none;
border:none;
outline:none;
color:white;
font-size:24px;
font-weight:700;
}

.search-box input::placeholder{

color:rgba(255,255,255,.5);
}

.search-btn{

width:66px;
height:66px;

border-radius:24px;

border:none;
cursor:pointer;

background:
linear-gradient(
135deg,
rgba(0,255,255,.2),
rgba(120,80,255,.25)
);

color:white;
font-size:36px;

box-shadow:
0 0 24px rgba(0,255,255,.25);
}

/* ===== NOVA ===== */

.nova-panel{

padding:18px;
min-height:520px;

display:flex;
justify-content:center;
align-items:flex-end;

position:relative;

background:
radial-gradient(
circle at center,
rgba(0,255,255,.08),
transparent 55%
),
linear-gradient(
180deg,
rgba(255,255,255,.03),
rgba(255,255,255,.02)
);
}

.nova-panel::before{

content:"";
position:absolute;
inset:0;

background:
radial-gradient(
circle,
rgba(120,180,255,.06),
transparent 70%
);

pointer-events:none;
}

.nova-img{

width:92%;
max-width:560px;

object-fit:contain;

filter:
drop-shadow(0 0 30px rgba(0,255,255,.18));
}

/* ===== 吹き出し ===== */

.nova-bubble{

position:absolute;

left:24px;
right:24px;
bottom:18px;

min-height:86px;

padding:18px 24px;

border-radius:26px;

display:flex;
align-items:center;

font-size:24px;
font-weight:800;

color:white;

background:
linear-gradient(
135deg,
rgba(120,40,255,.42),
rgba(80,120,255,.28)
);

border:
1px solid rgba(180,120,255,.45);

backdrop-filter:blur(12px);

box-shadow:
0 0 28px rgba(140,80,255,.22);

text-shadow:
0 0 10px rgba(255,255,255,.35);
}

/* ===== Dock ===== */

.dock{

padding:18px 16px;

display:flex;
gap:18px;

overflow-x:auto;
scroll-behavior:smooth;

-webkit-overflow-scrolling:touch;
}

.dock::-webkit-scrollbar{
display:none;
}

.app-icon{

min-width:118px;
height:132px;

border-radius:30px;

background:
linear-gradient(
180deg,
rgba(255,255,255,.12),
rgba(255,255,255,.04)
);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

border:
1px solid rgba(255,255,255,.12);

box-shadow:
inset 0 1px 1px rgba(255,255,255,.15),
0 8px 20px rgba(0,0,0,.28);

text-decoration:none;
color:white;
}

.app-icon img{

width:68px;
height:68px;
object-fit:contain;
}

.app-label{

margin-top:8px;
font-size:15px;
font-weight:700;
}

</style>
</head>

<body>

<div class="app">

<!-- 上 -->

<div class="top-wrap">

<div class="glass clock-box">

<div class="time" id="clock">
03:22
</div>

<div class="date">
2026/5/27（水）
</div>

</div>

<div class="glass weather">

<div style="font-size:42px;">
☁️
</div>

<div class="temp">
21°
</div>

<div style="
font-size:18px;
opacity:.8;
">
Partly cloudy
</div>

</div>

</div>

<!-- SEARCH -->

<div class="glass search-panel">

<div class="search-title">
NOVA SEARCH
</div>

<div class="search-box">

<input
id="novaInput"
type="text"
placeholder="NOVAに聞く…">

</div>

<button
class="search-btn"
onclick="sendToNova()">

🔎

</button>

</div>

<!-- NOVA -->

<div class="glass nova-panel">

<img
src="nova.png"
class="nova-img">

<div
class="nova-bubble"
id="novaBubble">

＞ ワイは待っとるで🙄

</div>

</div>

<!-- Dock -->

<div class="glass dock"><a
class="app-icon"
href="#">

<img src="icons/nova.png">

<div class="app-label">
Nova
</div>

</a>

<a
class="app-icon"
href="https://x.com"
target="_blank">

<img src="icons/x.png">

<div class="app-label">
X
</div>

</a>

<a
class="app-icon"
href="https://youtube.com"
target="_blank">

<img src="icons/youtube.png">

<div class="app-label">
YouTube
</div>

</a>

<a
class="app-icon"
href="https://studio.youtube.com"
target="_blank">

<img src="icons/studio.png">

<div class="app-label">
Studio
</div>

</a>

<a
class="app-icon"
href="mailto:"
target="_blank">

<img src="icons/mail.png">

<div class="app-label">
Mail
</div>

</a>

<a
class="app-icon"
href="https://jp.mercari.com"
target="_blank">

<img src="icons/mercari.png">

<div class="app-label">
Mercari
</div>

</a>

<a
class="app-icon"
href="https://amazon.co.jp"
target="_blank">

<img src="icons/amazon.png">

<div class="app-label">
Amazon
</div>

</a>

<a
class="app-icon"
href="https://www.dmm.com"
target="_blank">

<img src="icons/dmm.png">

<div class="app-label">
DMM
</div>

</a>

<a
class="app-icon"
href="https://bandai-hobby.net"
target="_blank">

<img src="icons/bandai.png">

<div class="app-label">
Bandai
</div>

</a>

</div>

</div>

<script>

/* ===== 時計 ===== */

function updateClock(){

const now=new Date();

const h=
String(now.getHours())
.padStart(2,"0");

const m=
String(now.getMinutes())
.padStart(2,"0");

document
.getElementById("clock")
.textContent=`${h}:${m}`;

}

updateClock();

setInterval(updateClock,1000);

/* ===== Nova送信 ===== */

async function sendToNova(){

const input=
document
.getElementById("novaInput");

const text=input.value.trim();

if(!text)return;

document
.getElementById("novaBubble")
.innerHTML=
"＞ 接続中や…🙄";

try{

const response=
await fetch(
"http://192.168.0.117:3000/message",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

}

);

const data=
await response.json();

document
.getElementById("novaBubble")
.innerHTML=
"＞ "+data.reply;

}catch(err){

document
.getElementById("novaBubble")
.innerHTML=
"＞ 接続できへん😢";

}

input.value="";

}

/* ===== Enter送信 ===== */

document
.getElementById("novaInput")
.addEventListener(
"keydown",
(e)=>{

if(e.key==="Enter"){

sendToNova();

}

}
);

</script>

</body>
</html>
