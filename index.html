<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nova OS</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06152f">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
    background:
    radial-gradient(circle at top,
    #0d4d6d 0%,
    #06152f 45%,
    #020814 100%);

    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.boot-screen{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(circle,
    #0b2b55 0%,
    #020814 100%);

    transition:opacity 1s ease;
}

.boot-screen.hide{
    opacity:0;
    pointer-events:none;
}

.boot-logo{
    width:210px;
    animation:
    bootFloat 4s ease-in-out infinite,
    bootAppear 1.2s ease;
}

.boot-text{
    margin-top:18px;
    font-size:26px;
    font-weight:700;
    letter-spacing:6px;
    color:#7de7ff;
    text-shadow:0 0 12px rgba(0,220,255,.8);
}

@keyframes bootAppear{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes bootFloat{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

.home{
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.panel{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    padding:18px;

    background:
    linear-gradient(
    145deg,
    rgba(20,40,80,.92),
    rgba(5,10,30,.94));

    border:1px solid rgba(126,231,255,.35);

    box-shadow:
    0 0 24px rgba(0,180,255,.14),
    inset 0 0 24px rgba(255,255,255,.03);
}

.clock{
    font-size:62px;
    font-weight:900;
    line-height:1;
}

.date{
    margin-top:6px;
    color:#79d8ff;
    font-size:20px;
    font-weight:700;
    line-height:1;
}

.weather{
    margin-top:14px;
    border-radius:18px;
    padding:14px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.10),
    rgba(255,255,255,.04));
}

.weather-title{
    font-size:16px;
}

.weather-temp{
    margin-top:4px;
    font-size:42px;
    font-weight:900;
}

.weather-desc{
    margin-top:2px;
    font-size:15px;
    opacity:.8;
}

.nova-panel{
    min-height:310px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.nova{
    width:100%;
    max-width:250px;
    object-fit:contain;
    filter:drop-shadow(0 0 24px rgba(0,180,255,.25));
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-7px);}
    100%{transform:translateY(0px);}
}

.bubble{
    position:absolute;
    bottom:12px;
    right:12px;

    max-width:76%;
    background:rgba(255,255,255,.96);
    color:black;

    padding:9px 14px;
    border-radius:999px;

    font-size:15px;
    font-weight:700;

    box-shadow:0 8px 18px rgba(0,0,0,.28);
}

.launcher{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.app-button{
    min-height:66px;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:white;

    font-size:18px;
    font-weight:800;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.10),
    rgba(255,255,255,.04));

    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);

    transition:.25s;
}

.app-button:active{
    transform:scale(.96);
    box-shadow:0 0 25px rgba(0,220,255,.45);
}

.nova-button{
    background:
    linear-gradient(
    135deg,
    rgba(0,220,255,.28),
    rgba(160,90,255,.22));
}

@media (min-width:700px){

    .home{
        max-width:520px;
        margin:0 auto;
    }

}

</style>
</head>

<body>

<div class="boot-screen" id="bootScreen">

<img
src="icon.png"
class="boot-logo"
alt="Nova Logo">

<div class="boot-text">
NOVA OS
</div>

</div>

<main class="home">

<section class="panel">

<div class="clock" id="clock">
00:00
</div>

<div class="date" id="date">
2026/5/26（火）
</div>

<div class="weather">

<div class="weather-title">
天気
</div>

<div class="weather-temp" id="weatherTemp">
取得中
</div>

<div class="weather-desc" id="weatherDesc">
天気データ確認中
</div>

</div>

</section>

<section class="panel nova-panel">

<img
class="nova"
id="novaImage"
src="./nova_normal.png"
alt="Nova">

<div class="bubble" id="novaBubble">
ワイはまだまだ元気や🙄
</div>

</section>

<section class="launcher">

<a
class="app-button nova-button"
href="https://chatgpt.com/"
target="_blank">
✨ Nova
</a>

<a
class="app-button"
href="https://www.youtube.com/"
target="_blank">
▶️ YouTube
</a>

<a
class="app-button"
href="https://x.com/hoshiyaAYATO"
target="_blank">
𝕏
</a>

<a
class="app-button"
href="https://calendar.google.com/"
target="_blank">
📅 Calendar
</a>

</section>

</main>

<script>

setTimeout(()=>{

    document
    .getElementById("bootScreen")
    .classList.add("hide");

},1800);

function updateClock(){

    const now=new Date();

    const h=
    String(now.getHours()).padStart(2,"0");

    const m=
    String(now.getMinutes()).padStart(2,"0");

    document.getElementById("clock").textContent=
    `${h}:${m}`;

    const days=[
    "日","月","火","水","木","金","土"
    ];

    document.getElementById("date").textContent=
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;

}

updateClock();

setInterval(updateClock,1000);

const novaData=[

{
img:"./nova_normal.png",
msg:"今日は何するんや？😼"
},

{
img:"./nova_sleepy.png",
msg:"そろそろ寝るか…😴"
},

{
img:"./nova_smile.png",
msg:"そのサムネ、伸びるぞ😎"
},

{
img:"./nova_troubled.png",
msg:"編集終わる気せーへん🙄"
},

{
img:"./nova_analysis.png",
msg:"配信前の作戦会議するか？😌"
}

];

function updateNova(){

    const random=
    novaData[
    Math.floor(Math.random()*novaData.length)
    ];

    document.getElementById("novaImage").src=
    random.img;

    document.getElementById("novaBubble").textContent=
    random.msg;

}

setInterval(updateNova,15000);

async function loadWeather(){

    try{

        const res=
        await fetch(
        "https://wttr.in/?format=j1"
        );

        const data=
        await res.json();

        const temp=
        data.current_condition[0].temp_C;

        const desc=
        data.current_condition[0]
        .weatherDesc[0].value;

        document.getElementById("weatherTemp")
        .textContent=`${temp}°`;

        document.getElementById("weatherDesc")
        .textContent=desc;

    }catch(e){

        document.getElementById("weatherTemp")
        .textContent="取得失敗";

        document.getElementById("weatherDesc")
        .textContent="天気APIエラー";

    }

}

loadWeather();

</script>

</body>
</html>
