<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nova OS</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06152f">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
    color:white;
    min-height:100vh;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 82% 0%,
    rgba(0,220,255,.38) 0%,
    transparent 32%),
    radial-gradient(circle at 10% 18%,
    rgba(160,90,255,.26) 0%,
    transparent 36%),
    linear-gradient(180deg,#071a38 0%,#020814 100%);

    animation:bgGlow 8s ease-in-out infinite alternate;
}

body.deep-night{
    background:
    radial-gradient(circle at 82% 0%,
    rgba(120,80,255,.34) 0%,
    transparent 34%),
    radial-gradient(circle at 10% 18%,
    rgba(0,220,255,.22) 0%,
    transparent 36%),
    linear-gradient(180deg,#08102c 0%,#02040d 100%);
}

body.morning{
    background:
    radial-gradient(circle at 82% 0%,
    rgba(0,240,255,.42) 0%,
    transparent 32%),
    radial-gradient(circle at 10% 18%,
    rgba(120,190,255,.24) 0%,
    transparent 36%),
    linear-gradient(180deg,#0a2448 0%,#020814 100%);
}

@keyframes bgGlow{
    from{filter:saturate(1) brightness(1);}
    to{filter:saturate(1.18) brightness(1.08);}
}

/* 起動画面 */

.boot-screen{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(circle,#0b2b55 0%,#020814 100%);

    transition:opacity .9s ease;
}

.boot-screen.hide{
    opacity:0;
    pointer-events:none;
}

.boot-logo{
    width:200px;
    animation:
    bootFloat 4s ease-in-out infinite,
    bootAppear 1.1s ease;
}

.boot-text{
    margin-top:16px;
    font-size:24px;
    font-weight:800;
    letter-spacing:6px;
    color:#7de7ff;
    text-shadow:0 0 12px rgba(0,220,255,.8);
}

@keyframes bootAppear{
    from{opacity:0;transform:scale(.72);}
    to{opacity:1;transform:scale(1);}
}

@keyframes bootFloat{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

/* 通知 */

.notice{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    left:50%;
    transform:translate(-50%,-120%);

    z-index:8000;

    width:calc(100% - 28px);
    max-width:480px;

    padding:12px 16px;
    border-radius:22px;

    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
    0 14px 32px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.18);

    display:flex;
    gap:10px;
    align-items:center;

    opacity:0;
    transition:.7s ease;
}

.notice.show{
    transform:translate(-50%,0);
    opacity:1;
}

.notice-icon{
    font-size:24px;
}

.notice-text{
    font-size:14px;
    font-weight:800;
}

/* 本体 */

.home{
    min-height:100vh;

    padding:10px;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-bottom:112px;

    display:flex;
    flex-direction:column;
    gap:9px;
}

.panel{
    position:relative;
    overflow:hidden;

    border-radius:24px;
    padding:14px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.16),
    rgba(255,255,255,.05));

    border:1px solid rgba(160,235,255,.32);

    box-shadow:
    0 18px 40px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 0 28px rgba(255,255,255,.04);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.top-panel{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
}

.clock{
    font-size:52px;
    font-weight:900;
    line-height:.95;
    letter-spacing:-1px;

    text-shadow:
    0 0 16px rgba(126,231,255,.7),
    0 0 42px rgba(0,220,255,.38);
}

.date{
    margin-top:6px;
    color:#79d8ff;
    font-size:17px;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
}

.weather-mini{
    width:108px;
    min-height:88px;

    border-radius:22px;
    padding:10px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.18),
    rgba(255,255,255,.06));

    border:1px solid rgba(255,255,255,.16);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 8px 24px rgba(0,0,0,.18);
}

.weather-title{
    font-size:12px;
    opacity:.82;
}

.weather-temp{
    margin-top:2px;
    font-size:29px;
    font-weight:900;
    line-height:1;
}

.weather-desc{
    margin-top:4px;
    max-width:88px;
    font-size:11px;
    opacity:.78;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* Nova */

.nova-panel{
    min-height:205px;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    padding-bottom:0;
}

.nova{
    width:100%;
    max-width:248px;
    margin-bottom:-42px;

    object-fit:contain;

    filter:
    drop-shadow(0 0 26px rgba(0,180,255,.36));

    animation:
    float 5s ease-in-out infinite,
    breath 4.2s ease-in-out infinite;

    transition:
    opacity .55s ease,
    transform .55s ease;
}

.nova.switching{
    opacity:.35;
    transform:translateY(8px) scale(.98);
}

@keyframes float{
    0%{translate:0 0;}
    50%{translate:0 -7px;}
    100%{translate:0 0;}
}

@keyframes breath{
    0%{scale:1;}
    50%{scale:1.018;}
    100%{scale:1;}
}

.bubble{
    position:absolute;
    bottom:7px;
    right:9px;

    max-width:76%;

    background:rgba(255,255,255,.94);
    color:#111;

    padding:7px 11px;
    border-radius:999px;

    font-size:13px;
    font-weight:800;

    box-shadow:
    0 8px 20px rgba(0,0,0,.28);

    opacity:1;
    transition:opacity .8s ease, transform .8s ease;
}

.bubble.fade{
    opacity:.18;
    transform:translateY(5px);
}

/* 固定Dock */

.dock-wrap{
    position:fixed;
    left:10px;
    right:10px;
    bottom:calc(10px + env(safe-area-inset-bottom));

    z-index:5000;

    padding:8px;

    border-radius:26px;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.16),
    rgba(255,255,255,.055));

    border:1px solid rgba(255,255,255,.16);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 16px 40px rgba(0,0,0,.32);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    overflow-x:auto;
    overflow-y:hidden;

    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
}

.dock-wrap::-webkit-scrollbar{
    display:none;
}

.dock-grid{
    display:flex;
    gap:10px;
    width:max-content;
}

.app-icon{
    flex:0 0 auto;

    width:64px;
    height:64px;

    border-radius:21px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;

    text-decoration:none;
    color:white;

    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.16),
    rgba(255,255,255,.055));

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 8px 20px rgba(0,0,0,.22);

    transition:.22s;
}

.app-icon:active{
    transform:scale(.94);
    box-shadow:
    0 0 22px rgba(0,220,255,.45);
}

.app-img{
    width:30px;
    height:30px;
    object-fit:contain;
    border-radius:9px;
}

.app-emoji{
    font-size:25px;
    line-height:1;
}

.app-label{
    font-size:9px;
    font-weight:800;
    opacity:.92;
}

.nova-app{
    background:
    linear-gradient(
    135deg,
    rgba(0,220,255,.42),
    rgba(160,90,255,.30));

    box-shadow:
    0 0 20px rgba(0,220,255,.40),
    0 0 48px rgba(0,220,255,.22),
    inset 0 1px 0 rgba(255,255,255,.16);

    animation:novaPulse 3s ease-in-out infinite;
}

@keyframes novaPulse{
    0%{
        box-shadow:
        0 0 18px rgba(0,220,255,.28),
        0 0 36px rgba(0,220,255,.14);
    }

    50%{
        box-shadow:
        0 0 30px rgba(0,220,255,.58),
        0 0 60px rgba(0,220,255,.30);
    }

    100%{
        box-shadow:
        0 0 18px rgba(0,220,255,.28),
        0 0 36px rgba(0,220,255,.14);
    }
}

@media (min-width:700px){
    .home{
        max-width:520px;
        margin:0 auto;
    }

    .dock-wrap{
        left:50%;
        right:auto;
        width:500px;
        transform:translateX(-50%);
    }
}

</style>
</head>

<body>

<div class="boot-screen" id="bootScreen">

<img
src="icon.png"
class="boot-logo"
alt="Nova Logo">

<div class="boot-text">
NOVA OS
</div>

</div>

<div class="notice" id="notice">

<div class="notice-icon">
🔔
</div>

<div class="notice-text" id="noticeText">
Nova OS 起動完了や🙄
</div>

</div>

<main class="home">

<section class="panel top-panel" id="topPanel">

<div>

<div class="clock" id="clock">
00:00
</div>

<div class="date" id="date">
2026/5/26（水）
</div>

</div>

<div class="weather-mini">

<div class="weather-title">
天気
</div>

<div class="weather-temp" id="weatherTemp">
--
</div>

<div class="weather-desc" id="weatherDesc">
取得中
</div>

</div>

</section>

<section class="panel nova-panel" id="novaPanel">

<img
class="nova"
id="novaImage"
src="./nova_normal.png"
alt="Nova">

<div class="bubble" id="novaBubble">
ワイはまだまだ元気や🙄
</div>

</section>

</main>

<section class="dock-wrap">

<div class="dock-grid">

<a
class="app-icon nova-app"
href="https://chatgpt.com/"
target="_blank">
<img class="app-img" src="icon.png" alt="Nova">
<div class="app-label">Nova</div>
</a>

<a
class="app-icon"
href="https://www.youtube.com/"
target="_blank">
<div class="app-emoji">▶️</div>
<div class="app-label">YouTube</div>
</a>

<a
class="app-icon"
href="https://studio.youtube.com/"
target="_blank">
<div class="app-emoji">🎬</div>
<div class="app-label">Studio</div>
</a>

<a
class="app-icon"
href="https://x.com/hoshiyaAYATO"
target="_blank">
<div class="app-emoji">𝕏</div>
<div class="app-label">X</div>
</a>

<a
class="app-icon"
href="https://calendar.google.com/"
target="_blank">
<div class="app-emoji">📅</div>
<div class="app-label">Calendar</div>
</a>

<a
class="app-icon"
href="https://keep.google.com/"
target="_blank">
<div class="app-emoji">📝</div>
<div class="app-label">Memo</div>
</a>

<a
class="app-icon"
href="https://drive.google.com/"
target="_blank">
<div class="app-emoji">📁</div>
<div class="app-label">Drive</div>
</a>

<a
class="app-icon"
href="https://mail.google.com/"
target="_blank">
<div class="app-emoji">✉️</div>
<div class="app-label">Mail</div>
</a>

</div>

</section>

<script>

setTimeout(()=>{

    document
    .getElementById("bootScreen")
    .classList.add("hide");

    showNotice("Nova OS 起動完了や🙄");

},1600);

function showNotice(text){

    const notice=
    document.getElementById("notice");

    const noticeText=
    document.getElementById("noticeText");

    noticeText.textContent=text;

    notice.classList.add("show");

    setTimeout(()=>{

        notice.classList.remove("show");

    },3200);

}

function setTimeTheme(){

    const hour=
    new Date().getHours();

    document.body.classList.remove(
    "deep-night",
    "morning"
    );

    if(hour>=0 && hour<5){
        document.body.classList.add("deep-night");
    }

    if(hour>=5 && hour<10){
        document.body.classList.add("morning");
    }

}

setTimeTheme();

function updateClock(){

    const now=new Date();

    const h=
    String(now.getHours()).padStart(2,"0");

    const m=
    String(now.getMinutes()).padStart(2,"0");

    document.getElementById("clock").textContent=
    `${h}:${m}`;

    const days=[
    "日","月","火","水","木","金","土"
    ];

    document.getElementById("date").textContent=
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;

    setTimeTheme();

}

updateClock();

setInterval(updateClock,1000);

const novaData=[

{
img:"./nova_normal.png",
msg:"今日は何するんや？😼"
},

{
img:"./nova_sleepy.png",
msg:"そろそろ寝るか…😴"
},

{
img:"./nova_smile.png",
msg:"そのサムネ、伸びるぞ😎"
},

{
img:"./nova_troubled.png",
msg:"編集終わる気せーへん🙄"
},

{
img:"./nova_analysis.png",
msg:"配信前の作戦会議するか？😌"
}

];

function updateNova(){

    const bubble=
    document.getElementById("novaBubble");

    const image=
    document.getElementById("novaImage");

    bubble.classList.add("fade");
    image.classList.add("switching");

    setTimeout(()=>{

        const random=
        novaData[
        Math.floor(Math.random()*novaData.length)
        ];

        image.src=
        random.img;

        bubble.textContent=
        random.msg;

        bubble.classList.remove("fade");
        image.classList.remove("switching");

    },500);

}

setInterval(updateNova,15000);

function weatherIcon(desc){

    const text=
    desc.toLowerCase();

    if(text.includes("rain")){
        return "🌧️";
    }

    if(text.includes("cloud")){
        return "☁️";
    }

    if(text.includes("snow")){
        return "❄️";
    }

    if(text.includes("clear") || text.includes("sun")){
        return "☀️";
    }

    if(text.includes("mist") || text.includes("fog")){
        return "🌫️";
    }

    return "🌤️";
}

async function loadWeather(){

    try{

        const res=
        await fetch(
        "https://wttr.in/?format=j1"
        );

        const data=
        await res.json();

        const temp=
        data.current_condition[0].temp_C;

        const desc=
        data.current_condition[0]
        .weatherDesc[0].value;

        document.getElementById("weatherTemp")
        .textContent=`${weatherIcon(desc)} ${temp}°`;

        document.getElementById("weatherDesc")
        .textContent=desc;

    }catch(e){

        document.getElementById("weatherTemp")
        .textContent="失敗";

        document.getElementById("weatherDesc")
        .textContent="APIエラー";

    }

}

loadWeather();

/* スマホ傾きパララックス */

window.addEventListener("deviceorientation",event=>{

    const x=
    Math.max(-12,Math.min(12,event.gamma || 0));

    const y=
    Math.max(-12,Math.min(12,event.beta || 0));

    const topPanel=
    document.getElementById("topPanel");

    const novaPanel=
    document.getElementById("novaPanel");

    topPanel.style.transform=
    `translate(${x * .25}px,${y * .08}px)`;

    novaPanel.style.transform=
    `translate(${x * .35}px,${y * .10}px)`;

});

</script>

</body>
</html>
